<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driving Experience - Step 2A</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.5;
      color: #22324a;
      background: #f0f4fa;
    }

    header, footer {
      text-align: center;
      padding: 20px 16px;
    }

    header {
      background: #173b67;
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 1.7rem;
    }

    main {
      max-width: 820px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      padding: 24px;
      border: 1px solid #d5dfec;
      border-radius: 12px;
    }

    h2 {
      margin-top: 0;
      color: #173b67;
    }

    fieldset {
      border: 1px solid #c4d1e2;
      border-radius: 8px;
      padding: 18px;
      margin: 20px 0;
    }

    legend {
      font-weight: bold;
      color: #173b67;
      padding: 0 8px;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .field {
      display: block;
      font-weight: bold;
    }

    .field input, .field select {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 11px;
      border: 1px solid #9baec7;
      border-radius: 6px;
      background: white;
      color: #22324a;
      font: inherit;
    }

    .field input:focus, .field select:focus {
      outline: 2px solid #3478c5;
      outline-offset: 1px;
    }

    .required {
      color: #b32332;
    }

    button {
      padding: 12px 28px;
      border: 0;
      border-radius: 6px;
      background: #1765b1;
      color: white;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #104d8b;
    }

    .note {
      color: #53647a;
      font-size: 0.9rem;
    }

    footer {
      color: #53647a;
      font-size: 0.9rem;
    }

    @media (min-width: 640px) {
      .fields {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Accompanied Driving Monitor</h1>
    <p>Record a driving experience</p>
  </header>

  <main>
    <section class="card" aria-labelledby="form-heading">

      <h2 id="form-heading">New driving experience</h2>

      <p>
        Fill in the fields below.
        Fields marked <span class="required">*</span> are required.
      </p>

      <form>

        <!-- Journey details -->
        <fieldset>
          <legend>Journey details</legend>

          <div class="fields">

            <label class="field" for="idExperience">
              Experience ID <span class="required">*</span>
              <input
                type="number"
                id="idExperience"
                name="idExperience"
                min="1"
                step="1"
                required>
            </label>

            <label class="field" for="date">
              Date <span class="required">*</span>
              <input
                type="date"
                id="date"
                name="date"
                required>
            </label>

            <label class="field" for="startingTime">
              Departure time <span class="required">*</span>
              <input
                type="time"
                id="startingTime"
                name="startingTime"
                required>
            </label>

            <label class="field" for="endingTime">
              Arrival time <span class="required">*</span>
              <input
                type="time"
                id="endingTime"
                name="endingTime"
                required>
            </label>

            <label class="field" for="km">
              Distance (km) <span class="required">*</span>
              <input
                type="number"
                id="km"
                name="km"
                min="0"
                step="0.1"
                placeholder="e.g. 22.4"
                required>
            </label>

          </div>
        </fieldset>

        <!-- Driving conditions -->
        <fieldset>
          <legend>Driving conditions</legend>

          <div class="fields">

            <!-- Weather -->
            <label class="field" for="idWeather">
              Weather <span class="required">*</span>

              <select id="idWeather" name="idWeather" required>
                <option value="">Choose weather</option>
                <option value="1">Sunny</option>
                <option value="2">Cloudy</option>
                <option value="3">Light rain</option>
                <option value="4">Heavy rain</option>
                <option value="5">Foggy</option>
                <option value="6">Windy</option>
                <option value="7">Snowy</option>
              </select>
            </label>

            <!-- Road type -->
            <label class="field" for="idRoadType">
              Road type <span class="required">*</span>

              <select id="idRoadType" name="idRoadType" required>
                <option value="">Choose road type</option>
                <option value="1">Urban streets</option>
                <option value="2">Motorway</option>
                <option value="3">Rural roads</option>
                <option value="4">Residential streets</option>
                <option value="5">Mountain roads</option>
              </select>
            </label>

            <!-- Traffic -->
            <label class="field" for="idTraffic">
              Traffic <span class="required">*</span>

              <select id="idTraffic" name="idTraffic" required>
                <option value="">Choose traffic</option>
                <option value="1">Light</option>
                <option value="2">Moderate</option>
                <option value="3">Heavy</option>
                <option value="4">Stop-and-go</option>
                <option value="5">Congested</option>
              </select>
            </label>

            <!-- Maneuver -->
            <label class="field" for="idManeuver">
              Maneuver <span class="required">*</span>

              <select id="idManeuver" name="idManeuver" required>
                <option value="">Choose maneuver</option>
                <option value="1">Parallel parking</option>
                <option value="2">Roundabout</option>
                <option value="3">Hill start</option>
                <option value="4">Reverse parking</option>
                <option value="5">Lane changing</option>
              </select>
            </label>

          </div>
        </fieldset>

        <!-- Save functionality will be added in a later step -->
        <button type="button">Save</button>

        <p class="note">
          Step 2A is a static form.
          Saving will be added in a later step.
        </p>

      </form>
    </section>
  </main>

  <footer>
    Created by Kanan Mikayilzada
    &mdash; Front-End Programming, 2026
  </footer>

</body>
</html>
