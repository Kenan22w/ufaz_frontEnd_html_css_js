<script type="text/javascript">
employees =[{"lastname":"Grimard","firstname":"Catherine","telephone":"03.21.39.60.34","email":"catherineGrimard@armyspy.com","address":{"street":"71, street St Ferréol","zipCode":57070,"city":"Metz"}},{"lastname":"Duperré","firstname":"Jean","telephone":"05.34.60.16.90","email":"Jean.Duperre@jourrapide.com","address":{"street":"75, street Jean Vilar","zipCode":24100,"city":"Bergerac"}},{"lastname":"Givry","firstname":"Denis","telephone":"04.98.02.77.68","email":"DenisGivry@teleworm.us","address":{"street":"32, Avenue De Marlioz","zipCode":74100,"city":"Annemasse"}}];	

console.log(employees);


//https://developer.mozilla.org/en-US/docs/Web/API/TrustedHTML
if (typeof trustedTypes === "undefined")
  trustedTypes = { createPolicy: (n, rules) => rules };


const politique = trustedTypes.createPolicy("content-policy", {
  createHTML(input) {
	const cleanHTML = DOMPurify.sanitize(input, { ALLOWED_TAGS: ['table', 'thead','tbody','tr','th','td'] });
    return cleanHTML; //see DOMPurify.sanitize()
  },
});


document.onreadystatechange = function () {
  if (document.readyState === "complete") {
    dynamicWriting();
  }
};	

function dynamicWriting(){

var htmlCode="<table><thead><tr><th>Lastnam</th><th>Firstname</th><th>Email</th></tr></thead><tbody>";

employees.forEach(function(item,index){
htmlCode+="<tr>";
htmlCode+=`<td>${item.lastname}</td>`;
htmlCode+=`<td>${item.firstname}</td>`;
htmlCode+=`<td>${item.email}</td>`;
htmlCode+="</tr>";

});//end forEach

htmlCode+="</tbody></table>";
console.log(typeof htmlCode);

//https://developer.mozilla.org/en-US/docs/Web/API/Element/insertAdjacentHTML
document.querySelector('#main').insertAdjacentHTML('beforeend',politique.createHTML(htmlCode));
}//end func
</script>

<style>
	body {font-family: Verdana;font-size: 12pt;}
	table {table-layout: auto;width: 800px;border:1px solid black;border-collapse: collapse;}
	th, td {border:1px solid black;}
</style>
</head>
<body>
<section id="main"></section>	
</body>
